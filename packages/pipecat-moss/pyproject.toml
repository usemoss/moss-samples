[project]
name = "pipecat-moss"
version = "0.0.5"
description = "Moss vector search integration for Pipecat"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
dependencies = [
    "moss>=1.14.0",
    "loguru>=0.7.0",
    "pipecat-ai>=1.5.0",
    "pydantic>=2.0.0",
    "pipecat-ai[runner]>=1.5.0",
]

[dependency-groups]
dev = [
    "aiortc>=1.14.0",
    "cartesia>=2.0.17",
    "daily-python~=0.27.0; sys_platform != 'win32'",
    "deepgram-sdk>=6.0.1,<7.0.0",
    "fastapi>=0.121.2",
    "opencv-python>=4.11.0.86",
    "python-dotenv>=1.2.1",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "D",  # pydocstyle
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E501"]
"src/pipecat_moss/moss_index_processor.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
