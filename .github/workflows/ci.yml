name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin ruff: 0.16.0 (released 2026-07-23) turned on a large new rule
        # surface that flags ~460 pre-existing findings across the repo and
        # breaks CI on every PR. Pinned to the last green version; bump only
        # once those findings are addressed.
        pip install ruff==0.15.22 mypy
        if [ -f examples/python/requirements.txt ]; then pip install -r examples/python/requirements.txt; fi
    # The JavaScript, Python and Elixir SDK folders are rebuilt from each SDK release, which runs its own checks.
    - name: Lint with ruff
      run: ruff check . --extend-exclude '**/*.ipynb,sdks/javascript/sdk,sdks/python/sdk,sdks/elixir/sdk'
    - name: Type check with mypy
      run: mypy examples/python apps/pipecat-moss apps/livekit-moss-vercel --ignore-missing-imports --exclude "apps/pipecat-moss/hume-ollama-local/create_index.py"

  javascript-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          examples/javascript/package-lock.json
          apps/next-js/package-lock.json
    - name: Install root dependencies
      run: npm ci
    - name: Install examples/javascript dependencies
      working-directory: examples/javascript
      run: npm ci
    - name: Install apps/next-js dependencies
      working-directory: apps/next-js
      run: npm ci
    - name: Lint (examples/javascript + apps/next-js)
      run: npm run lint
    - name: Type check (examples/javascript + apps/next-js)
      run: npm run type-check

  cookbook-langchain-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install package
      working-directory: examples/cookbook/langchain
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest
    - name: Run tests
      working-directory: examples/cookbook/langchain
      run: pytest -v

  python-sdk-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Compile the SDK source and samples
      run: python -m compileall -q sdks/python/sdk

  # Runs the pytest suites under packages/*. Before this job they executed
  # nowhere: ci.yml only covered sdks/python/sdk and the langchain cookbook, and
  # the publish-*.yml workflows only smoke-test `import <package>`.
  #
  # Python 3.12 is deliberate, not arbitrary. Several connector tests patch
  # `moss_connector_<x>.ingest.MossClient`, but each package's __init__ does
  # `from .ingest import ingest`, shadowing the submodule with the function.
  # unittest.mock resolves that target on 3.12+ and raises AttributeError on
  # 3.10/3.11, so a wider matrix would fail on a test-only issue. Widen it once
  # those patch targets stop relying on the shadowed name.
  #
  # Not covered: packages/moss-cli — `moss completions bash|zsh` is broken
  # (commands/completions.py exits 1 even when its fallback import succeeds) and
  # tests/test_completions.py fails accordingly. Add moss-cli here with that fix.
  python-package-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - agora-moss
          - dspy-moss
          - moss-data-connector/moss-connector-dynamodb
          - moss-data-connector/moss-connector-huggingface
          - moss-data-connector/moss-connector-mongodb
          - moss-data-connector/moss-connector-mysql
          - moss-data-connector/moss-connector-s3
          - moss-data-connector/moss-connector-sqlite
          - moss-data-connector/moss-connector-supabase
          - sim-moss
          - strands-agents-moss
          - ten-moss
          - vapi-moss
    name: python-package-test (${{ matrix.package }})
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install uv
      run: pip install uv
    - name: Install package with dev dependencies
      working-directory: packages/${{ matrix.package }}
      # --all-extras covers the [project.optional-dependencies] convention used
      # by the connectors; uv installs the default [dependency-groups] dev group
      # used by the rest. pytest is added at run time because some packages
      # (e.g. strands-agents-moss) don't declare it themselves.
      run: uv sync --all-extras --python 3.12
    - name: Run tests
      working-directory: packages/${{ matrix.package }}
      run: uv run --no-sync --with pytest --with pytest-asyncio pytest tests -v

  next-js-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/next-js/package-lock.json
    - name: Install dependencies
      working-directory: apps/next-js
      run: npm ci
    - name: Build
      working-directory: apps/next-js
      env:
        NEXT_PUBLIC_MOSS_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_MOSS_PROJECT_ID }}
        NEXT_PUBLIC_MOSS_PROJECT_KEY: ${{ secrets.NEXT_PUBLIC_MOSS_PROJECT_KEY }}
      run: npm run build
    - name: Run tests
      working-directory: apps/next-js
      run: npm test

  vercel-sdk-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: '20'
            ai-version: '^6.0.0'
          - node-version: '22'
            ai-version: '7.0.8'
    name: vercel-sdk-test (ai@${{ matrix.ai-version }}, node@${{ matrix.node-version }})
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: packages/vercel-sdk/package-lock.json
    - name: Install dependencies
      working-directory: packages/vercel-sdk
      run: npm ci
    - name: Override ai version
      working-directory: packages/vercel-sdk
      run: npm install --no-save ai@${{ matrix.ai-version }}
    - name: Build
      working-directory: packages/vercel-sdk
      run: npm run build
    - name: Run tests
      working-directory: packages/vercel-sdk
      run: npm test

  vercel-sdk-test:
    needs: vercel-sdk-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: test "${{ needs.vercel-sdk-matrix.result }}" = success

  vitepress-plugin-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      working-directory: packages/vitepress-plugin-moss
      run: pnpm install --frozen-lockfile
    - name: Build
      working-directory: packages/vitepress-plugin-moss
      run: pnpm build
    - name: Run tests
      working-directory: packages/vitepress-plugin-moss
      run: pnpm test

  agora-ten-samples-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install smoke deps
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio fastapi httpx pydantic python-dotenv
    - name: TEN graph + bench unit tests
      run: |
        pytest apps/ten-moss/tests apps/ten-moss/bench/test_run.py -v
    - name: custom-llm mock/doctor tests
      run: |
        pytest apps/agora-custom-llm-moss/tests -v
    - name: Echo-grounding table (no LLM keys)
      run: |
        python apps/ten-moss/bench/run.py --echo-grounding
